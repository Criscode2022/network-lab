<button
  type="button"
  class="btn btn-secondary max-w-full min-w-0 justify-between gap-2 md:min-w-44"
  [class.ring-1]="active()"
  [class.ring-brand-500/40]="active()"
  [class.min-h-9]="compact()"
  aria-haspopup="listbox"
  [attr.aria-expanded]="open()"
  [attr.aria-label]="t('lab.mine')"
  (click)="open.set(!open())"
>
  <span class="flex min-w-0 items-center gap-2">
    <nb-icon name="book" [size]="14" class="shrink-0" [class.text-brand-300]="active()" [class.text-ink-400]="!active()" />
    @if (active()) {
      <span class="chip chip-brand shrink-0 px-1.5">{{ t('lab.custom') }}</span>
      <span class="truncate">{{ current()?.name }}</span>
    } @else {
      <span class="truncate">{{ t('lab.mine') }}</span>
      @if (mine().length) {
        <span class="chip chip-muted shrink-0 px-1.5">{{ mine().length }}</span>
      }
    }
  </span>
  <nb-icon name="chevron-down" [size]="14" class="shrink-0 text-ink-400 transition-transform" [class.rotate-180]="open()" />
</button>

@if (open()) {
  <div
    class="card absolute right-0 z-40 mt-1.5 w-[min(92vw,26rem)] overflow-hidden animate-pop"
    role="listbox"
    [attr.aria-label]="t('lab.mine')"
  >
    <div class="border-b border-ink-700 px-3 py-2">
      <div class="flex items-center justify-between gap-2">
        <div class="text-xs font-semibold text-ink-50">{{ t('lab.mine') }}</div>
        <span class="text-[10px] text-ink-500">{{ t('lab.savedN', { n: mine().length }) }}</span>
      </div>
      <p class="mt-0.5 text-[10.5px] leading-snug text-ink-400">
        {{ localOnly() ? t('lab.libraryGuest') : t('lab.libraryAccount') }}
      </p>
    </div>
    <div class="scroll-thin max-h-[60dvh] overflow-auto p-1.5">
      @for (m of mine(); track m.id) {
        <div class="menu-item group items-start pr-1" [ngClass]="{ 'bg-ink-800 ring-1 ring-brand-500/40': m.id === currentId() }">
          <button type="button" class="flex min-w-0 flex-1 items-start gap-2 text-left" role="option" [attr.aria-selected]="m.id === currentId()" (click)="choose(m.id)">
            <nb-icon name="book" [size]="14" class="mt-0.5 shrink-0 text-ink-400" />
            <span class="min-w-0 flex-1">
              <span class="flex items-center gap-1.5">
                <span class="truncate text-xs font-medium text-ink-50">{{ m.name }}</span>
                @if (localOnly()) {
                  <span class="chip chip-muted shrink-0 px-1.5 text-[9px]">{{ t('lab.browser') }}</span>
                }
              </span>
              @if (blurb(m); as note) {
                <span class="mt-0.5 line-clamp-2 block text-[10.5px] leading-snug text-ink-400">{{ note }}</span>
              }
              <span class="mt-0.5 block text-[10px] text-ink-500">{{ when(m.updatedAt) }} · {{ t('lab.devicesN', { n: m.json.devices?.length ?? 0 }) }}</span>
            </span>
          </button>
          <button
            type="button"
            class="btn btn-ghost btn-icon h-7 w-7 text-ink-500 hover:text-danger-300"
            [attr.aria-label]="t('lab.deleteSaved')"
            [title]="t('lab.deleteSaved')"
            (click)="deleteMine.emit(m.id)"
          >
            <nb-icon name="trash" [size]="13" />
          </button>
        </div>
      } @empty {
        <p class="px-2.5 py-3 text-[10.5px] leading-relaxed text-ink-500">{{ t('lab.emptyMine') }}</p>
      }
      <div class="mt-1 border-t border-ink-800 pt-1.5">
        <button type="button" class="menu-item justify-center" (click)="openAll()">
          <nb-icon name="book" [size]="14" class="text-ink-400" /> {{ t('lab.libraryTitle') }}
        </button>
      </div>
    </div>
  </div>
}
